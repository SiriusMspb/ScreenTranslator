name: Build win64

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Run actions/checkout@v4
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Make a release
      shell: cmd
      run: |
        cd share\ci
        
        :: Регулярное выражение: находит строку app_version с любыми кавычками/пробелами и заменяет на "pass"
        python -c "import pathlib, re; p = pathlib.Path('config.py'); t = p.read_text(encoding='utf-8'); t = re.sub(r'app_version\s*\+=\s*\{[^}]*\}\[[^\]]*\]', 'pass', t); p.write_text(t, encoding='utf-8')"
        
        :: Запуск оригинальной логики компиляции автора
        python config.py
        python build.py
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-Fixed-Win64
        path: |
          share/ci/release/screen-translator.exe
          share/ci/release/*.dll
