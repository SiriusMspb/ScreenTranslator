name: App build

on: [push]

jobs:
  build:
    name: Build win64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Make a release
        shell: cmd
        run: |
          if not exist share\translations mkdir share\translations
          if not exist hunspell mkdir hunspell
          echo "" > share\translations\screentranslator_he.qm
          if not exist share\translations\screentranslator_ru.qm echo "" > share\translations\screentranslator_ru.qm
          echo "" > hunspell\hunspell.hxx
          
          powershell -Command "(Get-Content share\ci\config.py) -replace 'os.environ.get\(\''OS_NAME\''\)', '\"win64\"' -replace 'os.environ\[\''OS\''\]', '\"win64\"' | Set-Content share\ci\config.py"
          
          python ./share/ci/release.py
          
          for /f "delims=" %%i in ('python ./share/ci/release.py artifact_name') do set ARTIFACT_NAME=%%i
          echo artifact=%ARTIFACT_NAME% >> %GITHUB_ENV%

      - name: Upload build artifact
        if: env.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ./${{ env.artifact }}
