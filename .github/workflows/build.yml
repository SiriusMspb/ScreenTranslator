name: App build
on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Гарантированно ставит Qt 5.15.2 и сам прописывает пути к qmake
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'

      # Автоматически находит правильный vcvars64.bat для Visual Studio 2022
      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # Теперь и qmake, и nmake точно будут доступны в консоли
      - name: Configure and Build
        shell: cmd
        run: |
          qmake screen-translator.pro
          nmake
          
      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Fixed
          path: |
            **/*.exe
            **/*.dll
