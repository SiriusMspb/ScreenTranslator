name: App build
on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # Полностью вырезаем упоминания модуля правок и орфографии из всех файлов конфигурации проекта
      - name: Configure, Build and Deploy
        shell: cmd
        run: |
          if not exist share\translations mkdir share\translations
          echo "" > share\translations\screentranslator_he.qm
          echo "" > share\translations\screentranslator_ru.qm
          
          powershell -Command "(Get-Content src\src.pro) -replace 'SUBDIRS \+= correct', '' | Set-Content src\src.pro"
          powershell -Command "(Get-Content screen-translator.pro) -replace 'SUBDIRS \+= src', 'SUBDIRS = src' | Set-Content screen-translator.pro"
          powershell -Command "(Get-Content screen-translator.pro) -replace 'src.depends = .*', '' | Set-Content screen-translator.pro"
          
          qmake screen-translator.pro CONFIG+=release
          nmake
          windeployqt --release release\screen-translator.exe
          
      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Portable
          path: release/
