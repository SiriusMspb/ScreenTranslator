name: App build

on: [push]

jobs:
  build:
    name: Build win64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Make a release
        shell: bash
        run: |
          mkdir -p share/translations hunspell
          echo. > share/translations/screentranslator_he.qm
          echo. > share/translations/screentranslator_ru.qm
          echo. > hunspell/hunspell.hxx
          python ./share/ci/release.py
          echo "artifact=`python ./share/ci/release.py artifact_name`" >> \$GITHUB_ENV

      - name: Upload build artifact
        if: env.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: \${{ env.artifact }}
          path: ./\${{ env.artifact }}
