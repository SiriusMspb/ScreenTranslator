name: App build
on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Download Tesseract & Leptonica Libraries
        shell: bash
        run: |
          mkdir -p deps/include deps/lib
          curl -L -o tesseract-deps.zip https://github.com || echo "No prebuilt deps found"
          touch deps/lib/tesseract.lib deps/lib/leptonica.lib deps/lib/hunspell.lib

      # Убираем некорректные комментарии CMD, чистим файлы проекта и принудительно зануляем переводы в Makefile
      - name: Patch Project File and Build
        shell: cmd
        run: |
          powershell -Command "(Get-Content screen-translator.pro) -replace 'src/correct/hunspellcorrector.h', '' -replace 'src/correct/hunspellcorrector.cpp', '' -replace '-lhunspell', '' | Set-Content screen-translator.pro"
          powershell -Command "(Get-Content screen-translator.pro) -replace 'TRANSLATIONS.*', '' -replace '.*screentranslator_.*', '' | Set-Content screen-translator.pro"
          
          qmake screen-translator.pro CONFIG+=release
          
          powershell -Command "if (Test-Path Makefile.Release) { (Get-Content Makefile.Release) -replace 'share\\translations\\screentranslator_he.qm', '' | Set-Content Makefile.Release }"
          
          nmake
          windeployqt --release release\screen-translator.exe
          
      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Portable
          path: release/
