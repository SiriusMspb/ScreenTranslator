name: App build

on: [push]

jobs:
  build:
    name: Build win64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # Физически заменяем файлы через базовые команды эхо, полностью исключив powershell и его ошибки кавычек
      - name: Make a release
        shell: cmd
        run: |
          if not exist share\translations mkdir share\translations
          if not exist hunspell mkdir hunspell
          echo. > share\translations\screentranslator_he.qm
          echo. > share\translations\screentranslator_ru.qm
          echo. > hunspell\hunspell.hxx
          
          echo import os > share\ci\config.py
          echo os_name = "win64" >> share\ci\config.py
          echo app_version = "3.3.0" >> share\ci\config.py
          echo pr_dir = "." >> share\ci\config.py
          echo qt_dir = "." >> share\ci\config.py
          echo msvc_dir = "." >> share\ci\config.py
          
          echo def apply_cmd_env(cmd_env): > share\ci\common.py
          echo     import os >> share\ci\common.py
          echo     for k, v in cmd_env.items(): os.environ[k] = v >> share\ci\common.py
          echo def add_to_path(entry): >> share\ci\common.py
          echo     import os >> share\ci\common.py
          echo     os.environ["Path"] = entry + ";" + os.environ.get("Path", "") >> share\ci\common.py
          echo def extract(src, dest): >> share\ci\common.py
          echo     return >> share\ci\common.py
          
          echo def run(): pass > share\ci\get_qt.py
          echo def install(): pass >> share\ci\get_qt.py
          echo def run(): pass > share\ci\get_qt_ssl.py
          echo def install(): pass >> share\ci\get_qt_ssl.py
          echo def run(): pass > share\ci\get_leptonica.py
          echo def install(): pass >> share\ci\get_leptonica.py
          echo def run(): pass > share\ci\get_tesseract.py
          echo def install(): pass >> share\ci\get_tesseract.py
          echo def run(): pass > share\ci\get_hunspell.py
          echo def install(): pass >> share\ci\get_hunspell.py
          echo def run(): pass > share\ci\test.py
          echo def install(): pass >> share\ci\test.py
          
          python ./share/ci/release.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Fixed-Win64
          path: "**/*.zip"
