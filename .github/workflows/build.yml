name: App build
on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Native QMake and NMake Build
        shell: cmd
        run: |
          if not exist share\translations mkdir share\translations
          if not exist hunspell mkdir hunspell
          echo. > share\translations\screentranslator_he.qm
          echo. > share\translations\screentranslator_ru.qm
          echo. > hunspell\hunspell.hxx
          
          if not exist src\correct mkdir src\correct
          echo #pragma once > src\correct\corrector.h
          echo #pragma once > src\correct\correctorworker.h
          echo #pragma once > src\correct\hunspellcorrector.h
          echo. > src\correct\corrector.cpp
          echo. > src\correct\correctorworker.cpp
          echo. > src\correct\hunspellcorrector.cpp
          
          echo. > corrector.h
          echo. > correctorworker.h
          echo. > hunspellcorrector.h
          
          powershell -Command "(Get-Content screen-translator.pro) -replace 'src/correct/hunspellcorrector.ui', '' | Set-Content screen-translator.pro"
          
          qmake screen-translator.pro CONFIG+=release CONFIG+=no_hunspell
          nmake
          windeployqt --release release\screen-translator.exe
          
      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Portable-Win64
          path: release/
