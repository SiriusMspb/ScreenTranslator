name: Build win64

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Run actions/checkout@v4
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    # Этот готовый шаг автоматически и без багов включает компилятор MSVC и nmake в систему
    - name: Set up MSVC Developer Command Prompt
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    - name: Run QMake
      shell: cmd
      run: |
        qmake screen-translator.pro CONFIG+=release

    - name: Run NMake Compile
      shell: cmd
      run: |
        nmake
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-Fixed-Win64
        path: |
          release/screen-translator.exe
          release/*.dll
