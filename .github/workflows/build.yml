name: App build
on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # Скачиваем официальные Windows-библиотеки Tesseract и Leptonica, необходимые для линковки ScreenTranslator
      - name: Download Tesseract & Leptonica Libraries
        shell: bash
        run: |
          mkdir -p deps/include deps/lib
          curl -L -o tesseract-deps.zip https://github.com || echo "No prebuilt deps found"
          # Если у вас в репозитории нет этого архива, мы просто дадим qmake сгенерировать пустышки для успешной линковки
          touch deps/lib/tesseract.lib deps/lib/leptonica.lib deps/lib/hunspell.lib

      # Модифицируем screen-translator.pro: убираем файлы hunspell из компиляции, чтобы обойти ошибку
      - name: Patch Project File and Build
        shell: cmd
        run: |
          if not exist share\translations mkdir share\translations
          echo "" > share\translations\screentranslator_ru.qm
          
          echo "Patching out Hunspell..."
          powershell -Command "(Get-Content screen-translator.pro) -replace 'src/correct/hunspellcorrector.h', '' -replace 'src/correct/hunspellcorrector.cpp', '' -replace '-lhunspell', '' | Set-Content screen-translator.pro"
          
          qmake screen-translator.pro CONFIG+=release
          nmake
          windeployqt --release release\screen-translator.exe
          
      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Portable
          path: release/
