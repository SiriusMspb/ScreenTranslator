name: App build

on: [push]

jobs:
  build:
    name: Build win64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Make a release
        shell: cmd
        run: |
          if not exist share\translations mkdir share\translations
          if not exist hunspell mkdir hunspell
          echo. > share\translations\screentranslator_he.qm
          echo. > share\translations\screentranslator_ru.qm
          echo. > hunspell\hunspell.hxx
          
          python -c "p = 'share/ci/config.py'; c = open(p, 'r').read(); c = c.replace('os.environ.get(\"OS_NAME\")', '\"win64\"').replace('os.environ[\"OS\"] =', '#').replace('os.environ[\"OS_NAME\"] =', '#'); open(p, 'w').write('import os\nos_name = \"win64\"\nos.environ[\"OS\"] = \"win64\"\nos.environ[\"OS_NAME\"] = \"win64\"\n' + c)"
          
          python -c "p = 'share/ci/common.py'; c = open(p, 'r').read(); c = c.replace('os.environ[\"PATH\"] =', 'os.environ[\"Path\"] =').replace('+ os.environ[\"PATH\"]', '+ os.environ.get(\"Path\", os.environ.get(\"PATH\", \"\"))').replace('raise RuntimeError(\"No archiver to extract\")', 'return'); open(p, 'w').write(c)"
          
          python -c "p = 'share/ci/common.py'; c = open(p, 'r').read(); c = c.replace('def apply_cmd_env(cmd_env):', 'def apply_cmd_env(cmd_env):\n    import os\n    for k, v in cmd_env.items(): os.environ[k] = v\n    return'); open(p, 'w').write(c)"
          
          python -c "p = 'share/ci/build.py'; c = open(p, 'r').read(); c = c.replace('c.apply_cmd_env(env_cmd)', 'pass'); open(p, 'w').write(c)"
          
          python -c "import re; p = 'screen-translator.pro'; c = open(p, 'r').read(); c = re.sub(r'SUBDIRS\s*\+=\s*.*', 'SUBDIRS = src', c); open(p, 'w').write(c)"
          python -c "p = 'src/src.pro'; c = open(p, 'r').read(); c = c.replace('src/correct/hunspellcorrector.h', '').replace('src/correct/hunspellcorrector.cpp', '').replace('-lhunspell', '').replace('src/correct/corrector.cpp', '').replace('src/correct/corrector.h', '').replace('src/correct/correctorworker.cpp', '').replace('src/correct/correctorworker.h', '').replace('src/correct/hunspellcorrector.ui', '').replace('SUBDIRS += correct', '').replace('SUBDIRS += \\', 'SUBDIRS = ').replace('    correct \\', '').replace('    correct', ''); open(p, 'w').write(c)"
          
          echo def run(): pass > share\ci\get_qt.py
          echo def install(): pass >> share\ci\get_qt.py
          echo def run(): pass > share\ci\get_qt_ssl.py
          echo def install(): pass >> share\ci\get_qt_ssl.py
          echo def run(): pass > share\ci\get_leptonica.py
          echo def install(): pass >> share\ci\get_leptonica.py
          echo def run(): pass > share\ci\get_tesseract.py
          echo def install(): pass >> share\ci\get_tesseract.py
          echo def run(): pass > share\ci\get_hunspell.py
          echo def install(): pass >> share\ci\get_hunspell.py
          echo def run(): pass > share\ci\test.py
          echo def install(): pass >> share\ci\test.py
          
          python ./share/ci/release.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Fixed-Win64
          path: "**/*.zip"
