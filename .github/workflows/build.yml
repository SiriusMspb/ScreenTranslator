name: App build

on: [push]

jobs:
  build:
    name: Build win64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Make a release
        shell: cmd
        run: |
          if not exist share\translations mkdir share\translations
          if not exist hunspell mkdir hunspell
          echo "" > share\translations\screentranslator_he.qm
          if not exist share\translations\screentranslator_ru.qm echo "" > share\translations\screentranslator_ru.qm
          echo "" > hunspell\hunspell.hxx
          
          powershell -Command "$p = 'share\ci\config.py'; $c = Get-Content $p; $c = $c -replace 'os\.environ\.get\([^)]+\)', '\"win64\"'; $c = $c -replace 'os\.environ\[[^\]]+\]', '\"win64\"'; $c = 'import os' + [Environment]::NewLine + 'os_name = \"win64\"' + [Environment]::NewLine + 'os.environ = dict(OS=\"win64\", OS_NAME=\"win64\")' + [Environment]::NewLine + ($c -join [Environment]::NewLine); Set-Content $p $c"
          
          powershell -Command "$p = 'share\ci\common.py'; (Get-Content $p) -replace 'raise RuntimeError.*No archiver.*', 'return' | Set-Content $p"
          
          echo # Выжигаем содержимое get_qt.py и подсовываем пустые заглушки для всех возможных функций
          powershell -Command "echo 'def run(): pass' | Set-Content share\ci\get_qt.py"
          powershell -Command "echo 'def install(): pass' | Add-Content share\ci\get_qt.py"
          powershell -Command "echo 'if __name__ == \"__main__\": pass' | Add-Content share\ci\get_qt.py"
          
          python ./share/ci/release.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Fixed-Win64
          path: "**/*.zip"
