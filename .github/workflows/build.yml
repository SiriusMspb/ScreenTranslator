name: Build win64

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Run actions/checkout@v4
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '5.15.2'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'

    - name: Make a release
      shell: bash
      env:
        OS: Windows_NT  # Намертво прописываем системную переменную для Python
      run: |
        cd share/ci
        python3 config.py
        python3 build.py
        
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-Fixed-Win64
        path: |
          share/ci/release/screen-translator.exe
          share/ci/release/*.dll
