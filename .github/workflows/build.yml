name: App build

on: [push]

jobs:
  build:
    name: Build win64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtwebengine'

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Make a release
        shell: cmd
        run: |
          if not exist share\translations mkdir share\translations
          if not exist hunspell mkdir hunspell
          echo. > share\translations\screentranslator_he.qm
          if not exist share\translations\screentranslator_ru.qm echo "" > share\translations\screentranslator_ru.qm
          echo "" > hunspell\hunspell.hxx
          
          python -c "p = 'share/ci/config.py'; c = open(p, 'r').read(); c = c.replace('os.environ.get(\"OS_NAME\")', '\"win64\"').replace('os.environ[\"OS\"]', '\"win64\"'); open(p, 'w').write('import os\nos_name = \"win64\"\n' + c)"
          python -c "p = 'share/ci/common.py'; c = open(p, 'r').read(); c = c.replace('os.environ[\"PATH\"] =', 'os.environ[\"Path\"] =').replace('+ os.environ[\"PATH\"]', '+ os.environ.get(\"Path\", os.environ.get(\"PATH\", \"\"))').replace('raise RuntimeError(\"No archiver to extract\")', 'return'); open(p, 'w').write(c)"
          
          echo def run(): pass > share\ci\get_qt.py
          echo def install(): pass >> share\ci\get_qt.py
          echo def run(): pass > share\ci\get_qt_ssl.py
          echo def install(): pass >> share\ci\get_qt_ssl.py
          echo def run(): pass > share\ci\get_leptonica.py
          echo def install(): pass >> share\ci\get_leptonica.py
          echo def run(): pass > share\ci\get_tesseract.py
          echo def install(): pass >> share\ci\get_tesseract.py
          echo def run(): pass > share\ci\get_hunspell.py
          echo def install(): pass >> share\ci\get_hunspell.py
          echo def run(): pass > share\ci\test.py
          echo def install(): pass >> share\ci\test.py
          
          python -c "p = 'share/ci/release.py'; c = open(p, 'r').read(); c = c.replace(\"r('build.py')\", 'pass').replace(\"r('windeploy.py')\", 'pass'); open(p, 'w').write(c)"
          
          python -c "import os; [os.remove(os.path.join('src/release', f)) for f in os.listdir('src/release') if f.endswith('.obj')] if os.path.exists('src/release') else None"
          python -c "import os, shutil; shutil.rmtree('src/correct', ignore_errors=True)"
          
          python -c "p = 'src/src.pro'; c = open(p, 'r').read(); c = c.replace('SUBDIRS += correct', '').replace('    correct \\', '').replace('    correct', ''); open(p, 'w').write(c)"
          python -c "p = 'src/src.pri'; c = open(p, 'r').read(); c = c.replace('include(correct/correct.pri)', ''); open(p, 'w').write(c)"
          
          qmake screen-translator.pro CONFIG+=release CONFIG+=no_hunspell
          nmake release
          windeployqt --release src\release\screen-translator.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Ready-Win64
          path: |
            src/release/screen-translator.exe
            src/release/*.dll
