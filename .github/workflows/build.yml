name: App build
on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Qt and MinGW
        uses: davidmace/setup-qt@v1
        with:
          qt-version: '5.15.2'
          qt-modules: 'qtwebengine'

      - name: Configure and Build
        shell: cmd
        run: |
          qmake screen-translator.pro
          mingw32-make
          
      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Fixed
          path: |
            *.exe
            *.dll
