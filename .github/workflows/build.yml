name: App build
on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt via Choco
        run: |
          choco install qt5-default -y

      - name: Configure and Build
        shell: cmd
        run: |
          set PATH=C:\tools\Qt\5.15.2\mingw81_64\bin;C:\tools\Qt\5.15.2\mingw81_64\bin\..;%PATH%
          qmake screen-translator.pro
          mingw32-make
          
      - name: Upload Finished App
        uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-Fixed
          path: |
            *.exe
            *.dll
